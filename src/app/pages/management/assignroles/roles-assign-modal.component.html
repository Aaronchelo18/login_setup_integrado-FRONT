<div class="modal-backdrop" (click)="close()"></div>

<div class="modal">
  <header class="modal-head">
    <div class="user-profile">
      <div class="avatar-circle">
        {{ user.nombre[0] }}{{ user.paterno[0] }}
      </div>
      <div class="user-info">
        <span class="role-label">GESTIÓN DE ACCESOS</span>
        <h2 class="user-name">{{ fullName() }}</h2>
        <span class="user-email" *ngIf="user.correo">{{ user.correo }}</span>
      </div>
    </div>
    <button class="btn-close" (click)="close()" [disabled]="saving">
      <iconify-icon icon="lucide:x"></iconify-icon>
    </button>
  </header>

  <section class="modal-body">
    <p class="section-title">Selecciona los roles que tendrá el usuario:</p>
    
    <div class="roles-grid">
      <div 
        *ngFor="let r of roles" 
        class="role-item" 
        [class.active]="selected.has(r.id_rol)"
        [class.disabled]="saving"
        (click)="toggle(r.id_rol)">
        
        <div class="check-box">
          <iconify-icon [icon]="selected.has(r.id_rol) ? 'lucide:check-circle-2' : 'lucide:circle'"></iconify-icon>
        </div>
        <span class="role-text">{{ r.nombre }}</span>
      </div>
    </div>
  </section>

  <footer class="modal-foot">
    <button class="btn-cancel" (click)="close()" [disabled]="saving">Cancelar</button>
    <button class="btn-save" (click)="save()" [disabled]="saving">
      {{ saving ? 'Guardando...' : 'Actualizar Permisos' }}
    </button>
  </footer>
</div>
