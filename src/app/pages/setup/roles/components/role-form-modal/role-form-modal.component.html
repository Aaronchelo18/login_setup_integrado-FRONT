<div class="modal-backdrop" *ngIf="visible" (click)="onBackdrop($event)" (keydown.escape)="onEsc()" tabindex="-1">
  <div class="modal" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    
    <header class="modal-head">
      <h3>{{ editing ? 'Editar Rol' : 'Nuevo Rol' }}</h3>
      <button type="button" class="close-btn" (click)="close.emit()" [disabled]="saving" aria-label="Cerrar">
        <iconify-icon icon="lucide:x"></iconify-icon>
      </button>
    </header>

    <form [formGroup]="form" class="modal-body" (ngSubmit)="save()">
      <div *ngIf="serverError" class="server-error">{{ serverError }}</div>

      <div class="form-row">
        <label for="nombreInput">Nombre del Rol:</label>
        <input
          #first
          id="nombreInput"
          type="text"
          formControlName="nombre"
          maxlength="64"
          placeholder="Ej. Administrador de Sistema"
          [disabled]="saving"
          autocomplete="off"
        />
        <small class="err" *ngIf="form.get('nombre')?.touched && form.get('nombre')?.errors">
          {{ serverFieldErrors['nombre'] || (form.get('nombre')?.hasError('required') ? 'Este campo es obligatorio.' : '') }}
        </small>
      </div>

      <div class="form-row inline" *ngIf="!hideEstado">
        <label for="estadoCheck">Estado Activo:</label>
        <label class="switch">
          <input
            id="estadoCheck"
            type="checkbox"
            formControlName="estado"
            [disabled]="saving"
          />
          <span class="track"><span class="knob"></span></span>
        </label>
      </div>

      <footer class="modal-actions">
        <button type="button" class="btn outline danger" (click)="close.emit()" [disabled]="saving">
          Cancelar
        </button>
        <button type="submit" class="btn primary" [disabled]="form.invalid || saving || !canMutate">
          <span *ngIf="!saving">Guardar Cambios</span>
          <span *ngIf="saving">Procesando...</span>
        </button>
      </footer>
    </form>
  </div>
</div>
